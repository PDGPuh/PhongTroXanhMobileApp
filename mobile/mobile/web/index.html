<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="phong_tro_xanh_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>phong_tro_xanh_mobile</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="26308985257-c3tkae8c2jjtgs1biimctm2ga0h70fc0.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.launchGoogleSignIn = function(clientId) {
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        if (window.onGoogleAuthCallback) window.onGoogleAuthCallback(null, "Google Identity Services chưa tải xong.");
        return;
      }
      try {
        window.google.accounts.id.initialize({
          client_id: clientId,
          callback: function(res) {
            if (res && res.credential) {
              if (window.onGoogleAuthCallback) window.onGoogleAuthCallback(res.credential, null);
            } else {
              if (window.onGoogleAuthCallback) window.onGoogleAuthCallback(null, "Không nhận được token từ Google.");
            }
          },
          auto_select: false,
          cancel_on_tap_outside: true,
        });
        window.google.accounts.id.prompt(function(notification) {
          if (notification && (notification.isNotDisplayed() || notification.isSkippedMoment())) {
            console.warn("Google One-Tap notification:", notification);
          }
        });
      } catch (err) {
        if (window.onGoogleAuthCallback) window.onGoogleAuthCallback(null, err.toString());
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
