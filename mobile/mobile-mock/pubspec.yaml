name: phong_tro_xanh_mobile
description: Giao diện Flutter Phòng Trọ Xanh.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.3
dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  lucide_icons_flutter: ^3.1.21
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/references/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
          weight: 400
        - asset: assets/fonts/Lora.ttf
          weight: 700
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
